name: CI

on:
  push:
    branches: [ release/**, main, beta ]
  pull_request:
    branches: [ main, beta ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-timeout ruff mypy bandit pip-audit build

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

      - name: Run mypy typecheck
        run: mypy src/

      - name: Run bandit security check
        run: bandit -r src/

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

      - name: Run unit and CLI tests with coverage (fail under 90%)
        run: pytest tests/unit tests/cli --cov=oxtan --cov-report=term-missing --cov-fail-under=90

      - name: Build package
        run: python -m build

